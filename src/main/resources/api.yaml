openapi: 3.2.0
info:
  title: TIS Last Access API
  description: |
    This is an API specification for the TIS Last Access API. 
    It provides endpoints to submit info about the last access of users to TIS data across systems.
  version: 0.1.0

servers:
  - url: https://nimdta.tis.nhs.uk/useraccess
    description: Northern Ireland (production) server
  - url: https://apps.tis.nhs.uk/useraccess
    description: England (production) server
  - url: https://stage-apps.tis.nhs.uk/useraccess
    description: Staging server for testing

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth 2 access token for a service account, obtained from the authorization server
        using the client credentials grant and sent as `Authorization: Bearer <access-token>`.
        The token must be a signed JWT from the configured issuer, include this API's audience
        and grant the scope listed in each operation's security requirement.

  headers:
    WWW-Authenticate:
      description: The bearer authentication challenge defined by RFC 6750.
      schema:
        type: string
      example: Bearer error="insufficient_scope", error_description="The request requires higher privileges than provided by the access token."

  responses:
    Unauthorized:
      description: No valid access token was provided.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
    Forbidden:
      description: The access token is valid but does not grant the scope required by the operation.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'

  schemas:
    LastAccess:
      type: object
      required: [email, accessDateTime]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The email address of the user.
        accessDateTime:
          type: string
          format: date-time
          description: The date and time when the user last accessed the system.
          example: '2026-06-21T12:34:56Z'
paths:
  /api/logs:
    get:
      summary: Retrieves the last access information.
      description: |
        This endpoint allows clients to retrieve paginated last access information.
      security:
        - BearerAuth: [TBC]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 0
          description: The page number to retrieve.
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            maximum: 100
          description: The number of records per page.
      responses:
        '200':
          description: Successfully retrieved page of last access logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LastAccess'
    post:
      summary: Submits an array of user last access information.
      description: |
        This endpoint allows clients to submit an array of user last access information. 
        Each entry in the array should contain details about a user's last access to TIS data across systems.
      security:
        - BearerAuth: [TBC]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LastAccess'
      responses:
        '200':
          description: A notification that the last access information was successfully submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Last access information submitted successfully.
        '400':
          description: Bad Request - The request body is invalid or missing required fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid request body. Please check the submitted data.
